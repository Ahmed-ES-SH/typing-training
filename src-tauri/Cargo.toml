[package]
name = "typing-trainer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "typing_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
# Phase 7 (§17): native file open/save pickers + scoped file I/O for JSON
# import/export. fs access is restricted to user-picked paths (the dialog
# plugin extends the fs scope at runtime) plus the app-config dir for the
# reset flow — see src-tauri/capabilities/README.md.
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

